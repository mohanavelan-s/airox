<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Seal Text Curved Paths -->
    <!-- Top Arc Path -->
    <path id="arcTopText" d="M 40,160 A 110,110 0 0,1 260,160" />
    <!-- Bottom Arc Path -->
    <path id="arcBottomText" d="M 252,160 A 102,102 0 0,1 48,160" />
  </defs>

  <!-- LEFT CIRCULAR EMBLEM -->
  <g transform="translate(10, 0)">
    <!-- Outer Blue Ring -->
    <circle cx="150" cy="160" r="140" fill="#1b2e75" />
    <circle cx="150" cy="160" r="114" fill="#ffffff" />
    <circle cx="150" cy="160" r="88" fill="#1b2e75" />

    <!-- Outer Ring Text - White Bold -->
    <text font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="1.2">
      <textPath href="#arcTopText" startOffset="50%" text-anchor="middle">
        INNOVATE • TRANSFORM • INSPIRE
      </textPath>
    </text>

    <text font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="2">
      <textPath href="#arcBottomText" startOffset="50%" text-anchor="middle">
        ESTD. 1994
      </textPath>
    </text>

    <!-- INNER EMBLEM CONTENT -->
    <g transform="translate(150, 160)">
      <!-- Top SG Red Shield -->
      <path d="M-30,-72 L0,-88 L30,-72 L22,-42 L0,-32 L-22,-42 Z" fill="#d92323" stroke="#ffffff" stroke-width="2.5" />
      <path d="M-22,-68 L0,-80 L22,-68 L16,-46 L0,-38 L-16,-46 Z" fill="#ffffff" />
      <text x="0" y="-50" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="19" fill="#d92323" letter-spacing="-0.5">SG</text>

      <!-- Open Book (Orange / Yellow Pages) -->
      <path d="M-72,18 Q0,-5 72,18 L64,36 Q0,12 -64,36 Z" fill="#f97316" stroke="#ffffff" stroke-width="1.5" />
      <path d="M-68,22 Q0,2 68,22 L0,48 Z" fill="#ea580c" />
      <path d="M0,48 L0,5 Q0,2 -68,22 L0,48 Z" fill="#fb923c" />

      <!-- Central Torch & Flame -->
      <path d="M0,-35 C-22,-10 -26,10 0,32 C26,10 22,-10 0,-35 Z" fill="#d92323" />
      <path d="M0,-24 C-14,-5 -16,8 0,22 C16,8 14,-5 0,-24 Z" fill="#f97316" />
      <path d="M0,-12 C-7,0 -8,5 0,14 C8,5 7,0 0,-12 Z" fill="#fef08a" />
      <!-- Torch Handle -->
      <path d="M-6,28 L6,28 L4,50 L-4,50 Z" fill="#d92323" />
    </g>
  </g>

  <!-- RIGHT TEXT CONTENT -->
  <g transform="translate(310, 20)">
    <!-- Primary Heading: JJ COLLEGE -->
    <text x="0" y="85" font-family="'Impact', 'Arial Black', 'Arial Bold', sans-serif" font-weight="900" font-size="96" fill="#1b2e75" letter-spacing="1">
      JJ COLLEGE
    </text>

    <!-- Subheading: ENGINEERING AND TECHNOLOGY -->
    <text x="0" y="146" font-family="'Impact', 'Arial Black', 'Arial Bold', sans-serif" font-weight="900" font-size="52" fill="#1b2e75" letter-spacing="0.5">
      ENGINEERING AND TECHNOLOGY
    </text>

    <!-- Red Divider Line -->
    <line x1="0" y1="168" x2="670" y2="168" stroke="#d92323" stroke-width="4.5" />

    <!-- Subtitle: AUTONOMOUS -->
    <text x="335" y="202" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="30" fill="#ea580c" letter-spacing="6">
      AUTONOMOUS
    </text>

    <!-- Red Banner: SOWDAMBIKAA GROUP OF INSTITUTIONS -->
    <rect x="0" y="218" width="670" height="52" rx="6" fill="#d92323" />
    <text x="335" y="253" text-anchor="middle" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="2">
      SOWDAMBIKAA GROUP OF INSTITUTIONS
    </text>
  </g>
</svg>
